name: store-shots

# Microsoft Store screenshots in every listing language, made by the app's
# own framing and caption code (packaging/store_shots.py). Run by hand.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Render
        run: python packaging/store_shots.py --out dist/store-shots
      - uses: actions/upload-artifact@v6
        with:
          name: store-shots
          path: dist/store-shots
          if-no-files-found: error
      - name: Publish to the store-shots branch (for tools that cannot reach artifact storage)
        shell: bash
        run: |
          cd dist/store-shots
          git init -q -b store-shots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Store screenshots from ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" store-shots
