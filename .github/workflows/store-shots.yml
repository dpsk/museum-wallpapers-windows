name: store-shots

# Microsoft Store screenshots in every listing language, made by the app's
# own framing and caption code (packaging/store_shots.py). Run by hand.
on:
  workflow_dispatch:

jobs:
  shots:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Render
        run: python packaging/store_shots.py --out dist/store-shots
      - uses: actions/upload-artifact@v6
        with:
          name: store-shots
          path: dist/store-shots
          if-no-files-found: error
