name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # attach the installer to a release on tags

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Unit tests
        env:
          PYSTRAY_BACKEND: dummy
        run: python -m pytest -q

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt

      - name: Unit tests (incl. Windows layer)
        env:
          PYSTRAY_BACKEND: dummy
        run: python -m pytest -q

      - name: Live wallpaper round trip on the runner's desktop
        # Hosted runners have an odd desktop session; failures here are
        # informative, not fatal. The target laptop is the real test.
        continue-on-error: true
        env:
          MUSEUM_WALLPAPERS_LIVE_WALLPAPER: "1"
        run: python -m pytest -q -s tests/test_windows.py

      - name: Install Inno Setup (6.3+ for x64compatible)
        shell: pwsh
        run: |
          choco upgrade innosetup --no-progress -y
          (Get-Item "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe").VersionInfo.ProductVersion

      - name: Build app, self-test it, build installer and Store package
        run: python packaging/build.py

      - name: Install the Store package and self-test it with package identity
        # A copy signed with a throwaway certificate for this runner only;
        # the uploaded .msix stays unsigned (the Store signs it).
        shell: pwsh
        run: |
          $msix = (Get-ChildItem dist\MuseumWallpapers-*-store.msix | Select-Object -First 1).FullName
          [xml]$manifest = Get-Content packaging\AppxManifest.xml
          $publisher = $manifest.Package.Identity.Publisher
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher -KeyUsage DigitalSignature `
            -FriendlyName "Museum Wallpapers CI test" -CertStoreLocation Cert:\CurrentUser\My `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $test = "packaging\build\test.msix"
          Copy-Item $msix $test
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1).FullName
          & $signtool sign /fd SHA256 /sha1 $cert.Thumbprint /s My $test
          if ($LASTEXITCODE) { throw "signtool failed" }
          Export-Certificate -Cert $cert -FilePath packaging\build\test.cer | Out-Null
          Import-Certificate -FilePath packaging\build\test.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          Add-AppxPackage -Path $test
          Get-AppxPackage dpsk.MuseumWallpapers | Format-List Name, PackageFamilyName, Version, InstallLocation
          $report = "$pwd\packaging\build\selftest-msix.json"
          $alias = "$env:LOCALAPPDATA\Microsoft\WindowsApps\museum-wallpapers.exe"
          $proc = Start-Process -FilePath $alias -ArgumentList "selftest", "--out", "`"$report`"" -Wait -PassThru
          Get-Content $report
          $r = Get-Content $report -Raw | ConvertFrom-Json
          if ($proc.ExitCode -ne 0 -or -not $r.ok) { throw "packaged self-test failed" }
          if (-not $r.checks.packaged.value.packaged) { throw "the app did not run with package identity" }
          Remove-AppxPackage (Get-AppxPackage dpsk.MuseumWallpapers).PackageFullName

      - uses: actions/upload-artifact@v6
        with:
          name: MuseumWallpapers-Setup
          path: dist/MuseumWallpapers-Setup-*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        with:
          name: MuseumWallpapers-Store-msix
          path: dist/MuseumWallpapers-*-store.msix
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        with:
          name: selftest-report
          path: packaging/build/selftest*.json
        if: always()

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          # The .msix is the Store upload (unsigned, not installable as is).
          files: |
            dist/MuseumWallpapers-Setup-*.exe
            dist/MuseumWallpapers-*-store.msix
          generate_release_notes: true
